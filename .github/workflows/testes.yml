# Integração contínua: roda os testes automaticamente no GitHub
# a cada push, a cada pull request e também quando você clicar em "Run workflow".
name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api:
    name: Testes de API
    runs-on: ubuntu-24.04  # fixo: o rotulo "latest" migrou para o Ubuntu 26, sem suporte do Playwright
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Node (para subir o ServeRest)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do projeto
        run: pip install -r requirements.txt

      - name: Subir o ServeRest localmente
        run: |
          npx --yes serverest@latest -p 3000 &
          npx --yes wait-on http://localhost:3000/usuarios --timeout 60000

      - name: Rodar testes de API
        id: testes
        continue-on-error: true
        env:
          API_URL: http://localhost:3000
        run: pytest -m api --html=reports/relatorio-api.html --self-contained-html

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-api
          path: reports/

      - name: Guardar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api
          path: allure-results/
          if-no-files-found: ignore

      - name: Refletir o resultado dos testes
        if: steps.testes.outcome == 'failure'
        run: exit 1

  web:
    name: Testes Web (Playwright)
    runs-on: ubuntu-24.04  # fixo: o rotulo "latest" migrou para o Ubuntu 26, sem suporte do Playwright
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e navegador
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar testes web
        id: testes
        continue-on-error: true
        run: pytest -m web --html=reports/relatorio-web.html --self-contained-html

      - name: Guardar relatório e prints de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-web
          path: |
            reports/
            test-results/

      - name: Guardar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-web
          path: allure-results/
          if-no-files-found: ignore

      - name: Refletir o resultado dos testes
        if: steps.testes.outcome == 'failure'
        run: exit 1

  # Junta os resultados das duas suítes num relatório só. Separar API e Web
  # em dois jobs deixa a execução mais rápida; juntar os relatórios evita que
  # quem for olhar precise abrir dois lugares.
  relatorio:
    name: Relatório Allure
    needs: [api, web]
    if: always()
    runs-on: ubuntu-24.04  # fixo: o rotulo "latest" migrou para o Ubuntu 26, sem suporte do Playwright
    steps:
      - name: Baixar os resultados da API
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-api
          path: allure-results

      - name: Baixar os resultados da Web
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-web
          path: allure-results

      - name: Recuperar o histórico
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Sem copiar o histórico do relatório anterior, cada execução nasce
      # sem memória e o gráfico de tendência não existe.
      - name: Preservar o histórico
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/
            echo "Histórico recuperado"
          else
            echo "Sem histórico anterior (primeira execução)"
          fi

      - name: Preparar Java (o Allure roda sobre a JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Allure
        run: npm install -g allure-commandline --silent

      - name: Gerar o relatório
        run: allure generate allure-results --clean -o allure-report

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
