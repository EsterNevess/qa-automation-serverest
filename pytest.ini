[pytest]
# Pasta onde o pytest procura os testes
testpaths = tests
pythonpath = .

# -v mostra o nome de cada teste; -rA mostra um resumo no final
# --screenshot only-on-failure tira um print da tela quando um teste web falha
# --output define a pasta onde ficam esses prints
addopts = -v -rA --screenshot only-on-failure --output test-results

# "Etiquetas" para rodar só um grupo de testes (ex.: pytest -m api)
markers =
    api: testes da API REST (usuários, login e produtos)
    web: testes de interface no navegador (Playwright)
    smoke: testes rápidos e essenciais, para checar se o básico funciona
